name: 📦 Build APK Debug
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Build APK
        run: chmod +x ./gradlew && ./gradlew clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: Bloom-APK-Debug, path: app/build/outputs/apk/debug/app-debug.apk, retention-days: 30 }
